<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="血战湘江历史影像原图与修复上色图对比">
  <title>血战湘江｜历史影像对比</title>
  <style>
    :root { color-scheme: light; --ink: #28251f; --muted: #6e685f; --paper: #f5f2eb; --accent: #8d382c; }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--paper); color: var(--ink); font-family: "Microsoft YaHei", "PingFang SC", system-ui, sans-serif; }
    main { width: min(100% - 32px, 1040px); margin: 0 auto; padding: clamp(30px, 7vw, 72px) 0 36px; }
    .eyebrow { margin: 0 0 12px; color: var(--accent); font-size: 12px; letter-spacing: .18em; }
    h1 { margin: 0; font-family: "Songti SC", "SimSun", serif; font-weight: 600; font-size: clamp(30px, 6vw, 54px); letter-spacing: .06em; }
    .intro { margin: 14px 0 24px; color: var(--muted); font-size: 15px; line-height: 1.9; }
    .frame { position: relative; overflow: hidden; border: 1px solid #d9d2c5; background: #e8e3d9; box-shadow: 0 18px 55px #51463718; }
    .frame img { display: block; width: 100%; height: auto; }
    .restored { position: absolute; inset: 0; clip-path: inset(0 0 0 var(--split, 50%)); }
    .divider { position: absolute; z-index: 2; top: 0; bottom: 0; left: var(--split, 50%); width: 2px; background: white; box-shadow: 0 0 4px #0008; pointer-events: none; }
    .handle { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 44px; height: 44px; display: grid; place-items: center; border: 2px solid white; border-radius: 50%; background: var(--accent); color: white; font-size: 18px; line-height: 1; box-shadow: 0 1px 8px #0005; }
    .slider { position: absolute; z-index: 3; top: 50%; left: 0; transform: translateY(-50%); width: 100%; height: 48px; margin: 0; appearance: none; -webkit-appearance: none; background: transparent; cursor: ew-resize; }
    .slider::-webkit-slider-runnable-track { height: 48px; background: transparent; }
    .slider::-moz-range-track { height: 48px; background: transparent; }
    .slider::-webkit-slider-thumb { width: 48px; height: 48px; appearance: none; -webkit-appearance: none; border: 0; background: transparent; }
    .slider::-moz-range-thumb { width: 48px; height: 48px; border: 0; background: transparent; }
    .labels { position: absolute; z-index: 1; top: 12px; left: 12px; right: 12px; display: flex; justify-content: space-between; pointer-events: none; }
    .labels span { padding: 6px 9px; border-radius: 3px; background: #171512aa; color: white; font-size: 12px; }
    .caption { display: flex; justify-content: space-between; gap: 16px; margin-top: 12px; color: var(--muted); font-size: 12px; line-height: 1.7; }
    .note { margin-top: 36px; padding-top: 16px; border-top: 1px solid #d9d2c5; color: #80796e; font-size: 12px; line-height: 1.8; }
    a { color: var(--accent); }
    @media (max-width: 560px) { main { width: min(100% - 24px, 1040px); padding-top: 30px; } .caption { flex-direction: column; gap: 2px; } .labels { top: 8px; left: 8px; right: 8px; } .labels span { padding: 5px 7px; font-size: 11px; } }
  </style>
</head>
<body>
  <main>
    <p class="eyebrow">HISTORICAL IMAGE · RESTORATION</p>
    <h1>血战湘江</h1>
    <p class="intro">拖动图片中间的滑块，比较历史影像原图与修复上色版本。</p>
    <div class="frame" style="--split: 50%">
      <img src="images/xiangjiang-original.png" alt="血战湘江历史影像原图">
      <img class="restored" src="images/xiangjiang-restored.png" alt="血战湘江修复上色版本">
      <div class="labels"><span>历史原图</span><span>修复上色图</span></div>
      <div class="divider"><span class="handle">↔</span></div>
      <input class="slider" type="range" min="0" max="100" value="50" aria-label="拖动滑块对比修复前后图片">
    </div>
    <div class="caption"><span>左侧：黑白原图</span><span>右侧：修复上色图</span></div>
    <p class="note">图片说明：修复上色图为历史影像的数字修复版本。请以原始史料为准。<br><a href="zunyi.html">← 遵义会议</a>　<a href="./">四渡赤水 →</a></p>
  </main>
  <script>
    document.querySelectorAll(".frame").forEach(function (frame) {
      var slider = frame.querySelector(".slider");
      slider.addEventListener("input", function () {
        frame.style.setProperty("--split", slider.value + "%");
      });
    });
  </script>
</body>
</html>
